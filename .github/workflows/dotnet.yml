# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Sentinel API Assurance CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      DOTNET_PROJECT: src/SentinelApiAssurance/SentinelApiAssurance.csproj

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore "$DOTNET_PROJECT"

    - name: Build
      run: dotnet build "$DOTNET_PROJECT" --configuration Release --no-restore

    - name: Validate regression suite
      run: dotnet run --project "$DOTNET_PROJECT" --configuration Release -- --dry-run
