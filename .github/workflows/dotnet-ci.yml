name: .NET CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-dry-run:
    name: Build and dry-run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/SentinelApiAssurance/SentinelApiAssurance.csproj

      - name: Build
        run: dotnet build src/SentinelApiAssurance/SentinelApiAssurance.csproj --configuration Release --no-restore

      - name: Dry-run suite validation
        run: dotnet run --project src/SentinelApiAssurance/SentinelApiAssurance.csproj --configuration Release -- --dry-run
